# =============================================================================
#  Decap CMS — لوحة تحكم موقع شباب الإحسان   (الرابط:  /admin)
#  الإعداد خطوة واحدة: غيّروا السطر  repo  أدناه إلى  اسم-حسابكم/اسم-المستودع
#  التفاصيل الكاملة في README.md
# =============================================================================
backend:
  name: github
  repo: chababELihsan/chabab-el-ihssan
  branch: main
local_backend:  true
locale: fr
media_folder: public/images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: news
  label: الأخبار
  label_singular: خبر
  folder: src/content/news
  extension: json
  format: json
  create: true
  identifier_field: title.fr
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{date}} — {{title.fr}}'
  sortable_fields:
  - date
  - is_pinned
  fields:
  - label: التاريخ
    name: date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    picker_utc: false
    required: true
  - label: الصورة
    name: image_url
    widget: image
    required: false
    hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
  - label: تثبيت في الأعلى
    name: is_pinned
    widget: boolean
    default: false
    required: false
  - label: العنوان
    name: title
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: string
      required: true
    - label: Français
      name: fr
      widget: string
      required: true
    - label: English (اختياري)
      name: en
      widget: string
      required: false
  - label: نص الخبر
    name: description
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: text
      required: true
    - label: Français
      name: fr
      widget: text
      required: true
    - label: English (اختياري)
      name: en
      widget: text
      required: false
  - label: المكان
    name: location
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: string
      required: false
    - label: Français
      name: fr
      widget: string
      required: false
    - label: English (اختياري)
      name: en
      widget: string
      required: false
- name: activities
  label: الأنشطة والمشاريع
  label_singular: نشاط
  folder: src/content/activities
  extension: json
  format: json
  create: true
  identifier_field: title.fr
  slug: '{{category}}-{{slug}}'
  summary: '{{category}} — {{title.fr}}'
  sortable_fields:
  - date
  - category
  fields:
  - label: النوع
    name: category
    widget: select
    options:
    - label: مشروع (Projet)
      value: project
    - label: حدث / فعالية (Événement)
      value: event
    - label: برنامج (Programme)
      value: program
    default: project
  - label: تاريخ البداية
    name: date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    picker_utc: false
    required: true
  - label: تاريخ النهاية (اختياري)
    name: end_date
    widget: datetime
    date_format: YYYY-MM-DD
    time_format: false
    format: YYYY-MM-DD
    picker_utc: false
    required: false
  - label: الصورة
    name: image_url
    widget: image
    required: false
    hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
  - label: تثبيت في الأعلى
    name: is_pinned
    widget: boolean
    default: false
    required: false
  - label: العنوان
    name: title
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: string
      required: true
    - label: Français
      name: fr
      widget: string
      required: true
    - label: English (اختياري)
      name: en
      widget: string
      required: false
  - label: الوصف
    name: description
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: text
      required: true
    - label: Français
      name: fr
      widget: text
      required: true
    - label: English (اختياري)
      name: en
      widget: text
      required: false
  - label: المكان
    name: location
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: string
      required: false
    - label: Français
      name: fr
      widget: string
      required: false
    - label: English (اختياري)
      name: en
      widget: string
      required: false
- name: numbers
  label: الأرقام والحملة
  files:
  - name: impact
    label: أرقام «أثرنا في المجتمع»
    file: src/content/impact.json
    format: json
    fields:
    - label: عنوان القسم
      name: title
      widget: object
      collapsed: false
      fields:
      - label: العربية
        name: ar
        widget: string
        required: true
      - label: Français
        name: fr
        widget: string
        required: true
      - label: English (اختياري)
        name: en
        widget: string
        required: false
    - label: جملة تحت العنوان
      name: description
      widget: object
      collapsed: false
      fields:
      - label: العربية
        name: ar
        widget: string
        required: true
      - label: Français
        name: fr
        widget: string
        required: true
      - label: English (اختياري)
        name: en
        widget: string
        required: false
    - label: الأرقام (يُنصح بـ 4)
      name: stats
      widget: list
      fields:
      - label: الرقم
        name: number
        widget: string
        hint: 'مثال: 13,000+ أو 318. الرمز + اختياري.'
      - label: الأيقونة
        name: icon
        widget: select
        options:
        - label: وجبات
          value: meals
        - label: ملابس
          value: clothes
        - label: هلال / رمضان
          value: moon
        - label: قوافل
          value: caravan
        - label: أشخاص
          value: people
        - label: قلب
          value: heart
        - label: ماء
          value: water
        - label: مدرسة
          value: school
        - label: سيارة إسعاف
          value: ambulance
        - label: مسكن
          value: home
        - label: قفة
          value: basket
        - label: تبرع
          value: donation
        default: heart
      - label: الوصف تحت الرقم
        name: label
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: true
        - label: Français
          name: fr
          widget: string
          required: true
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      required: false
      summary: '{{fields.number}}'
      collapsed: false
      min: 1
      max: 8
  - name: campaign
    label: الحملة الحالية (المبلغ + العدّ التنازلي)
    file: src/content/campaign.json
    format: json
    fields:
    - label: إظهار قسم الحملة في الصفحة الرئيسية
      name: enabled
      widget: boolean
      default: true
      required: false
    - label: عنوان الحملة
      name: title
      widget: object
      collapsed: false
      fields:
      - label: العربية
        name: ar
        widget: string
        required: true
      - label: Français
        name: fr
        widget: string
        required: true
      - label: English (اختياري)
        name: en
        widget: string
        required: false
    - label: وصف الحملة
      name: description
      widget: object
      collapsed: false
      fields:
      - label: العربية
        name: ar
        widget: text
        required: true
      - label: Français
        name: fr
        widget: text
        required: true
      - label: English (اختياري)
        name: en
        widget: text
        required: false
    - label: الهدف (دج)
      name: goal
      widget: number
      value_type: int
      min: 0
      hint: المبلغ المطلوب جمعه بالدينار الجزائري.
    - label: المبلغ المجموع إلى الآن (دج)
      name: raised
      widget: number
      value_type: int
      min: 0
      hint: عدّلوا هذا الرقم كلما وصلتكم تبرعات جديدة.
    - label: تاريخ ونهاية الحملة
      name: endDate
      widget: datetime
      date_format: YYYY-MM-DD
      time_format: HH:mm
      format: YYYY-MM-DDTHH:mm:ss
      picker_utc: false
      hint: العدّ التنازلي يتوقف عند هذا التاريخ.
- name: testimonials
  label: آراء المتابعين
  label_singular: رأي
  folder: src/content/testimonials
  extension: json
  format: json
  create: true
  identifier_field: name
  slug: avis-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}
  summary: '{{name}}'
  fields:
  - label: الاسم
    name: name
    widget: string
  - label: منشور في الموقع
    name: is_approved
    widget: boolean
    default: true
    required: false
  - label: الصورة (اختياري)
    name: image_url
    widget: image
    required: false
    hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
  - label: الصفة
    name: role
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: string
      required: false
    - label: Français
      name: fr
      widget: string
      required: false
    - label: English (اختياري)
      name: en
      widget: string
      required: false
  - label: نص الرأي
    name: content
    widget: object
    collapsed: false
    fields:
    - label: العربية
      name: ar
      widget: text
      required: false
    - label: Français
      name: fr
      widget: text
      required: false
    - label: English (اختياري)
      name: en
      widget: text
      required: false
    hint: يكفي كتابته مرة واحدة؛ إن تُرك فارغًا بإحدى اللغات تُستعمل لغة أخرى تلقائيًا.
- name: media
  label: الصور والوسائط
  files:
  - name: gallery
    label: معرض الصور
    file: src/content/gallery.json
    format: json
    fields:
    - label: أقسام المعرض
      name: categories
      widget: list
      fields:
      - label: المعرّف (أحرف لاتينية صغيرة بلا مسافات)
        name: id
        widget: string
        pattern:
        - ^[a-z0-9-]+$
        - أحرف لاتينية صغيرة وأرقام وشرطة فقط
      - label: اسم القسم
        name: label
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: true
        - label: Français
          name: fr
          widget: string
          required: true
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      required: false
      summary: '{{fields.id}}'
    - label: الصور
      name: images
      widget: list
      fields:
      - label: الصورة
        name: image_url
        widget: image
        required: true
        hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
      - label: التعليق
        name: caption
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: false
        - label: Français
          name: fr
          widget: string
          required: false
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      - label: القسم
        name: category
        widget: relation
        collection: media
        file: gallery
        search_fields:
        - categories.*.id
        value_field: categories.*.id
        display_fields:
        - categories.*.id
      - label: صورة مميزة
        name: is_featured
        widget: boolean
        default: false
        required: false
      required: false
      summary: '{{fields.category}}'
  - name: projects
    label: فئات المشاريع الرئيسية
    file: src/content/projects.json
    format: json
    fields:
    - label: الفئات الرئيسية للمشاريع
      name: categories
      widget: list
      fields:
      - label: المعرّف (أحرف لاتينية صغيرة بلا مسافات)
        name: id
        widget: string
        pattern:
        - ^[a-z0-9-]+$
        - أحرف لاتينية صغيرة وأرقام وشرطة فقط
      - label: صورة الفئة
        name: image
        widget: image
        required: false
        hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
      - label: اسم الفئة
        name: title
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: true
        - label: Français
          name: fr
          widget: string
          required: true
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      - label: وصف قصير
        name: description
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: false
        - label: Français
          name: fr
          widget: string
          required: false
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      - label: المشاريع داخل الفئة
        name: items
        widget: list
        fields:
        - label: المعرّف
          name: id
          widget: string
          required: false
        - label: الصورة
          name: image
          widget: image
          required: false
          hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
        - label: اسم المشروع
          name: title
          widget: object
          collapsed: false
          fields:
          - label: العربية
            name: ar
            widget: string
            required: true
          - label: Français
            name: fr
            widget: string
            required: true
          - label: English (اختياري)
            name: en
            widget: string
            required: false
        required: false
        summary: '{{fields.id}}'
      required: false
      summary: '{{fields.id}}'
  - name: media
    label: فيديو، قبل/بعد، الخريطة، الصدقة الجارية
    file: src/content/media.json
    format: json
    fields:
    - label: فيديو الصفحة الرئيسية (اختياري)
      name: heroVideo
      widget: object
      fields:
      - label: معرّف فيديو يوتيوب
        name: youtubeId
        widget: string
        required: false
        hint: 'الجزء الأخير من الرابط، مثال: dQw4w9WgXcQ. اتركه فارغًا لإخفاء الزر.'
      - label: أو رابط ملف فيديو
        name: src
        widget: string
        required: false
      - label: صورة الغلاف
        name: poster
        widget: string
        required: false
    - label: صورة الواجهة الرئيسية (Hero)
      name: heroImage
      widget: image
      required: false
      hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
    - label: قبل / بعد
      name: beforeAfter
      widget: list
      fields:
      - label: المعرّف
        name: id
        widget: string
        required: false
      - label: صورة «قبل»
        name: before
        widget: image
        required: false
        hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
      - label: صورة «بعد»
        name: after
        widget: image
        required: true
        hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
      - label: العنوان
        name: title
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: true
        - label: Français
          name: fr
          widget: string
          required: true
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      - label: تعليق
        name: caption
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: false
        - label: Français
          name: fr
          widget: string
          required: false
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      required: false
      summary: '{{fields.id}}'
    - label: خريطة الإنجازات
      name: achievementPlaces
      widget: list
      fields:
      - label: المعرّف
        name: id
        widget: string
        required: false
      - label: اسم الولاية
        name: name
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: true
        - label: Français
          name: fr
          widget: string
          required: true
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      - label: خط العرض (Latitude)
        name: lat
        widget: number
        value_type: float
        min: -90
        max: 90
        step: 0.0001
      - label: خط الطول (Longitude)
        name: lng
        widget: number
        value_type: float
        min: -180
        max: 180
        step: 0.0001
      - label: الأعمال المنجزة هناك
        name: actions
        widget: list
        fields:
        - label: العربية
          name: ar
          widget: string
        - label: Français
          name: fr
          widget: string
        - label: English
          name: en
          widget: string
          required: false
        required: false
        summary: '{{fields.fr}}'
      required: false
      summary: '{{fields.id}}'
    - label: مشاريع الصدقة الجارية
      name: sadaqaProjects
      widget: list
      fields:
      - label: المعرّف
        name: id
        widget: string
        required: false
      - label: الأيقونة
        name: icon
        widget: select
        options:
        - label: بئر / ماء
          value: well
        - label: مدرسة
          value: school
        - label: سيارة إسعاف
          value: ambulance
        - label: خزان
          value: tank
        default: well
      - label: العنوان
        name: title
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: string
          required: true
        - label: Français
          name: fr
          widget: string
          required: true
        - label: English (اختياري)
          name: en
          widget: string
          required: false
      - label: الوصف
        name: description
        widget: object
        collapsed: false
        fields:
        - label: العربية
          name: ar
          widget: text
          required: true
        - label: Français
          name: fr
          widget: text
          required: true
        - label: English (اختياري)
          name: en
          widget: text
          required: false
      required: false
      summary: '{{fields.id}}'
- name: settings
  label: إعدادات الموقع
  files:
  - name: settings
    label: الاتصال وروابط التواصل وفيسبوك/إنستغرام
    file: src/content/settings.json
    format: json
    fields:
    - label: شعار الجمعية
      name: logo_url
      widget: image
      required: true
      hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
    - label: عنوان الموقع (لمحركات البحث)
      name: site_url
      widget: string
      hint: 'مثال: https://chababelihssan.com — بدون / في النهاية.'
    - label: البريد الإلكتروني
      name: email
      widget: string
    - label: الهاتف كما يظهر في الموقع
      name: phone_display
      widget: string
    - label: رقم واتساب بالصيغة الدولية
      name: whatsapp
      widget: string
      hint: 'بدون + ولا مسافات، مثال: 213557343528'
    - label: العنوان
      name: address
      widget: object
      collapsed: false
      fields:
      - label: العربية
        name: ar
        widget: string
        required: false
      - label: Français
        name: fr
        widget: string
        required: false
      - label: English (اختياري)
        name: en
        widget: string
        required: false
    - label: روابط التواصل
      name: social
      widget: object
      fields:
      - label: فيسبوك
        name: facebook
        widget: string
        required: false
      - label: إنستغرام
        name: instagram
        widget: string
        required: false
      - label: X (تويتر)
        name: x
        widget: string
        required: false
      - label: يوتيوب
        name: youtube
        widget: string
        required: false
      - label: تيك توك
        name: tiktok
        widget: string
        required: false
    - label: قسم منشورات فيسبوك وإنستغرام
      name: social_feed
      widget: object
      fields:
      - label: إظهار القسم في الصفحة الرئيسية
        name: enabled
        widget: boolean
        default: true
        required: false
      - label: رابط صفحة فيسبوك
        name: facebook_page_url
        widget: string
        hint: 'مثال: https://www.facebook.com/chababelihssan3 — تظهر منشوراتها تلقائيًا.'
      - label: رابط خلاصة إنستغرام (JSON)
        name: instagram_feed_url
        widget: string
        required: false
        hint: رابط من خدمة مثل behold.so يبدأ بـ https://feeds.behold.so/ . بدونه تظهر المنشورات اليدوية أدناه.
      - label: منشورات إنستغرام يدوية (بديل)
        name: instagram_manual_posts
        widget: list
        fields:
        - label: الصورة
          name: image
          widget: image
          required: true
          hint: ارفع صورة من جهازك، أو الصق رابط صورة موجودة.
        - label: رابط المنشور على إنستغرام
          name: link
          widget: string
        - label: تعليق قصير
          name: caption
          widget: string
          required: false
