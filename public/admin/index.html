<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#7a1034" />
    <title>لوحة التحكم — شباب الإحسان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- CSS حرج مضمّن: خلفية وشاشة تحميل من أول لحظة (لا وميض أبيض ولا قفزات) -->
    <style>
      html, body { margin: 0; background: #f4f2ef; }
      #cei-splash { position: fixed; inset: 0; z-index: 100010; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(135deg, #1a0a10 0%, #5c0a1a 55%, #7a1034 100%); color: #fff; font-family: 'Cairo', system-ui, sans-serif;
        transition: opacity .45s ease, visibility .45s ease; }
      #cei-splash b { font-size: 26px; letter-spacing: .3px; }
      #cei-splash small { opacity: .7; font-size: 14px; }
      #cei-splash i { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #f2b705; animation: ceiSpin .8s linear infinite; }
      html.cei-ready #cei-splash { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes ceiSpin { to { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <div id="cei-splash" aria-live="polite"><i></i><b>شباب الإحسان</b><small>جارٍ تحميل لوحة التحكم…</small></div>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <!-- Decap CMS : الحقول معرّفة في /admin/config.yml ، والإضافات (الدليل/المعاينة/تصغير الصور) في /admin/admin.js -->
    <script src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"></script>
    <script src="/admin/admin.js"></script>
  </body>
</html>
